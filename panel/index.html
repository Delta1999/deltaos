<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Delta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face{font-family:Doto;font-weight:400;src:url(/fonts/doto-400.ttf)}
@font-face{font-family:Doto;font-weight:900;src:url(/fonts/doto-900.ttf)}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(/fonts/plexmono-400.ttf)}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(/fonts/plexmono-500.ttf)}

:root{--bg:#000;--fg:#f2f2f2;--dim:#5a5a5a;--faint:#1c1c1c;--red:#ff2d1f;--line:#262626;
  --dot:"Doto","IBM Plex Mono",monospace;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr auto;gap:28px;padding:32px 40px}
.dot{font-family:var(--dot);font-weight:900;letter-spacing:.04em}
.lbl{font-size:12px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
#hora{font-size:92px;line-height:.9}
#fecha{margin-top:8px}
.meta{display:flex;gap:36px;text-align:right}
.meta div{max-width:300px}
.meta b{display:block;font-weight:500;font-size:15px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok{color:var(--fg)}.mal{color:var(--red)}
main{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:1.6fr 1fr;gap:28px;min-height:0}
.card{border:1px solid var(--line);border-radius:22px;padding:22px 26px;position:relative;overflow:hidden;min-height:0}
#hero{display:flex;flex-direction:column;justify-content:space-between}
canvas{width:100%;flex:1;min-height:0;display:block}
#estado{font-size:76px;line-height:1;margin-top:10px}
#sub{color:var(--dim);font-size:14px;margin-top:8px;height:18px}
#frases{display:flex;flex-direction:column;justify-content:flex-end;gap:22px}
.fr{font-size:22px;line-height:1.35;color:var(--dim)}
.fr:last-child{color:var(--fg)}
.fr small{display:block;font-size:11px;letter-spacing:.2em;margin-bottom:4px;color:var(--red)}
footer{display:grid;grid-template-columns:1.2fr .9fr .8fr 1.35fr;gap:28px}
.big{font-size:54px;line-height:1;margin:10px 0}
.row{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;gap:12px}
.row span:last-child{text-align:right}
.bar{height:10px;background:radial-gradient(circle,var(--fg) 38%,transparent 42%) 0 0/10px 10px;
  -webkit-mask:linear-gradient(90deg,#000 var(--p),transparent var(--p));mask:linear-gradient(90deg,#000 var(--p),transparent var(--p));margin-top:6px}
.bar.r{background-image:radial-gradient(circle,var(--red) 38%,transparent 42%)}
.vacio{color:var(--dim);font-size:13px;margin-top:10px}
#clima canvas{width:auto;flex:none;display:inline-block}
.cl{display:flex;align-items:center;gap:18px}.cl .big{margin:0}
.hs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 4px;text-align:center}
.hs div{font-size:12px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:5px}
.hs b{color:var(--fg);font-weight:500}
#der{display:flex;flex-direction:column;gap:28px;min-height:0}
#der #frases{flex:1}
#consola{padding:18px 22px 16px;display:flex;flex-direction:column;gap:12px}
.gs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g{text-align:center;display:flex;flex-direction:column;align-items:center}
.g canvas{flex:none;width:100%;height:92px}
.g .lbl{margin-top:8px}.g b{font-family:var(--dot);font-weight:900;font-size:19px;letter-spacing:.04em;margin-top:2px}
.mando{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.lamps{display:flex;gap:14px;flex-wrap:wrap}
.lamp{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.lamp i{width:9px;height:9px;border-radius:50%;border:1px solid var(--dim)}
.lamp.ok i{background:var(--fg);border-color:var(--fg);box-shadow:0 0 7px #fff9}.lamp.ok{color:var(--fg)}
.lamp.act i{background:var(--fg);border-color:var(--fg);animation:pul 1.2s ease-in-out infinite}.lamp.act{color:var(--fg)}
.lamp.mal i{background:var(--red);border-color:var(--red);animation:par .9s steps(2) infinite}.lamp.mal{color:var(--red)}
@keyframes par{50%{opacity:.12}}@keyframes pul{50%{opacity:.25}}
.btns{display:flex;gap:8px}
.btn{font:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg);background:transparent;border:1px solid var(--dim);border-radius:99px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--fg)}.btn:active{transform:translateY(1px)}
.btn.on{background:var(--red);border-color:var(--red);color:#000}
.fr small.i{color:var(--dim)}
#cel{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9}
#cel.on{display:flex}
#cel canvas{position:absolute;inset:0;width:100%;height:100%;flex:none}
#cel .dot{position:relative;font-size:150px;color:var(--red)}
#cel p{position:relative;font-size:22px;margin-top:18px}
</style>
</head>
<body>
<header>
  <div><div id="hora" class="dot">--:--</div><div id="fecha" class="lbl"></div></div>
  <div class="meta">
    <div><span class="lbl">Sesión</span><b id="conexion">—</b></div>
    <div><span class="lbl">Voz</span><b id="voz">—</b></div>
    <div><span class="lbl">Memoria</span><b id="memoria">—</b></div>
    <div><span class="lbl">Última actividad</span><b id="ultima">—</b></div>
  </div>
</header>
<main>
  <section class="card" id="hero">
    <canvas id="cv"></canvas>
    <div><div id="estado" class="dot">CARGANDO</div><div id="sub"></div></div>
  </section>
  <div id="der">
    <section class="card" id="consola">
      <div class="gs">
        <div class="g"><canvas id="g0"></canvas><span class="lbl">Micro</span><b id="v0">—</b></div>
        <div class="g"><canvas id="g1"></canvas><span class="lbl">Voz</span><b id="v1">—</b></div>
        <div class="g"><canvas id="g2"></canvas><span class="lbl">Respuesta</span><b id="v2">—</b></div>
      </div>
      <div class="mando">
        <div class="lamps">
          <span class="lamp" id="l-enlace"><i></i>Enlace</span><span class="lamp" id="l-mic"><i></i>Mic</span>
          <span class="lamp" id="l-aec"><i></i>Eco</span><span class="lamp" id="l-claude"><i></i>Claude</span>
          <span class="lamp" id="l-impresora"><i></i>3D</span>
        </div>
        <div class="btns">
          <button class="btn" id="b-priv">Privacidad</button><button class="btn" id="b-modo">Alertas</button><button class="btn" id="b-dormir">Dormir</button>
        </div>
      </div>
    </section>
    <section class="card" id="frases"></section>
  </div>
</main>
<footer>
  <section class="card" id="imp"></section>
  <section class="card" id="trab"></section>
  <section class="card" id="sis"></section>
  <section class="card" id="clima"></section>
</footer>
<div id="cel"><canvas id="cv2"></canvas><div class="dot">LISTO</div><p id="celtxt"></p></div>

<script>
const $=i=>document.getElementById(i), esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let S={estado:'cargando',nivel:0,mic:{nivel:0},lat:null};
const bar=(p,r)=>`<div class="bar${r?' r':''}" style="--p:${Math.max(0,Math.min(100,p))}%"></div>`;
const mmss=s=>s==null?'—':s<90?`${Math.round(s)} s`:s<5400?`${Math.round(s/60)} min`:`${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min`;

function claude(c){if(!c||!c.tarea)return '<div class="vacio">Ninguna tarea.</div>';
  const pasos=c.pasos.map(p=>`<div class="row"><span>${esc(p.t).slice(0,46)}</span><span class="${p.e==='en curso'?'ok':p.e==='falló'?'mal':''}">${p.e==='hecho'?'✓':p.e==='falló'?'✗':'…'}</span></div>`).join('');
  return `<div class="row"><span>${esc(c.tarea).slice(0,60)}</span></div>${c.permiso?`<div class="row mal"><span>¿Permitir? ${esc(c.permiso).slice(0,50)}</span></div>`:''}${pasos}`}
function pintar(d){
  S=d;
  $('hora').textContent=d.hora; $('fecha').textContent=d.fecha;
  const c=$('conexion'); c.textContent=d.conexion.toUpperCase(); c.className=d.conexion==='conectado'?'ok':'mal';
  $('voz').textContent=d.voz;
  $('memoria').textContent=`${d.memoria.n} notas`+(d.memoria.ultima?` · ${d.memoria.ultima}`:'');
  $('ultima').textContent=d.ultima<5?'ahora':`hace ${mmss(d.ultima)}`;
  $('estado').textContent=d.estado.toUpperCase();
  $('estado').style.color=d.estado==='dormido'?'var(--dim)':'var(--fg)';
  $('sub').textContent=d.priv?'PRIVACIDAD · el micro se ignora, ni «Delta»':d.herramienta?`usando: ${d.herramienta}`:d.sueno!=null?`duerme en ${d.sueno} s`:'di «Delta» o pulsa Enter';
  $('frases').innerHTML=d.modo==='alertas'
   ?(d.notifs.length?d.notifs.slice(-4).map(n=>`<div class="fr"><small class="${n.tipo==='alerta'?'':'i'}">${n.t} · ${n.tipo.toUpperCase()}</small>${esc(n.txt)}</div>`).join(''):'<div class="vacio">Sin avisos.</div>')
   :d.frases.length?d.frases.map(f=>`<div class="fr"><small>${esc(f.rol).toUpperCase()}</small>${esc(f.t)}</div>`).join(''):'<div class="vacio">Sin conversación todavía.</div>';
  for(const k in d.salud)$('l-'+k).className='lamp '+d.salud[k];
  $('b-priv').className='btn'+(d.priv?' on':'');$('b-priv').textContent=d.priv?'Privacidad · ON':'Privacidad';
  $('b-modo').className='btn'+(d.modo==='alertas'?' on':'');$('b-modo').textContent=d.modo==='alertas'?'Alertas · ON':'Alertas'+(d.nuevas?` · ${d.nuevas}`:'');
  $('b-dormir').textContent=d.estado==='dormido'?'Activar':'Dormir';
  $('v0').textContent=d.mic.db==null?'—':d.mic.db+' dB';$('v1').textContent=d.estado==='hablando'?'HABLA':'—';
  $('v2').textContent=d.lat==null?'—':(d.lat/1000).toFixed(1)+' s';

  const p=d.impresora;
  $('imp').innerHTML=`<span class="lbl">Impresora · Klipper</span>`+(!p||!p.online?'<div class="big dot" style="color:var(--dim)">SIN CONEXIÓN</div>':
   `<div class="big dot">${p.estado==='printing'||p.estado==='paused'?p.prog+'%':p.estado.toUpperCase()}</div>`+bar(p.prog,p.estado==='printing')+
   (p.archivo?`<div class="row"><span>${esc(p.archivo)}</span><span>${p.quedan!=null?'quedan '+mmss(p.quedan):''}</span></div>`:'')+
   `<div class="row"><span>Boquilla</span><span>${p.boquilla[0]}/${p.boquilla[1]} °C</span></div><div class="row"><span>Cama</span><span>${p.cama[0]}/${p.cama[1]} °C</span></div>`);

  const j=Object.entries(d.trabajos), li=a=>a.map(([n,e])=>`<div class="row"><span>${esc(n)}</span><span class="${e==='en curso'?'ok':''}">${esc(e)}</span></div>`).join('');
  $('trab').innerHTML=`<span class="lbl">Trabajos</span>${li(j)||'<div class="vacio">Ninguno.</div>'}<div class="lbl" style="margin-top:20px">Claude Code · ${esc(d.claude?d.claude.estado:'—')}</div>${claude(d.claude)}`;

  const s=d.sistema||{};
  $('sis').innerHTML=`<span class="lbl">Sistema</span>`+[['RAM',s.ram,'%'],['SWAP',s.swap,'%'],['CPU',s.cpu,'%'],['TEMP',s.temp,' °C']].map(([n,v,u])=>
   `<div class="row"><span>${n}</span><span>${v==null?'—':v+u}</span></div>`+bar(n==='TEMP'?v:v,v>85)).join('');

  const w=d.clima;
  if(w){const n=new Date(),min=n.getHours()*60+n.getMinutes(),noche=min<w.sale||min>w.pone,k=n.getHours()+(n.getMinutes()>=30?1:0);
   const hs=w.horas.filter(x=>x.k>n.getHours()).slice(0,4),hm=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
   $('clima').innerHTML=`<span class="lbl">Tiempo · ${esc(w.ciudad)}</span><div class="cl" style="margin-top:10px"><canvas id="ic0"></canvas><div><div class="big dot">${w.temp}°</div><div class="row" style="margin-top:2px"><span>${esc(w.desc)}</span></div></div></div>`+
   `<div class="row"><span>${w.min}° / ${w.max}°</span><span>Sensación ${w.sens}°</span></div>`+
   `<div class="hs">${hs.map((x,i)=>`<div><b>${String(x.k%24).padStart(2,'0')}h</b><canvas id="ih${i}"></canvas>${x.t}°</div>`).join('')}</div>`+
   `<div class="row"><span>Viento ${w.viento} km/h ${w.dir}</span><span>Lluvia ${w.lluvia}%</span></div><div class="row"><span>Hum ${w.hum}% · UV ${w.uv}</span><span>↑ ${hm(w.sale)}  ↓ ${hm(w.pone)}</span></div>`;
   icono($("ic0"),w.code,noche,5);hs.forEach((x,i)=>icono($('ih'+i),x.c,x.k%24*60<w.sale||x.k%24*60>w.pone,3))}
  else $('clima').innerHTML='<span class="lbl">Tiempo</span><div class="vacio">Sin datos.</div>';

  if(d.evento&&d.evento.id!==(window._ev||0)){window._ev=d.evento.id;celebrar(d.evento)}
}

/* ---------- iconos del tiempo (11x11 puntos) ---------- */
const SOL=["...#...",".#...#.","..###..","#.###.#","..###..",".#...#.","...#..."],
 NUBE=["....###....","..#######..",".#########.","###########","###########",".#########."],
 LUNA=["....####...","..###......",".###.......",".###.......",".###.......",".###.......","..###......","....####..."];
const GOTAS=[".#...#...#.","..#...#...."],COPOS=["..#.#.#.#..","...#...#..."],
 RAYO=["....##.....","...##......","..#####....","....##.....","...##......"];
function sprite(g,s,x,y,o){s.forEach((r,j)=>[...r].forEach((c,i)=>{if(c=='#')g[y+j][x+i]=1;else if(o)g[y+j][x+i]=0}))}
function trama(code,noche){const g=Array.from({length:11},()=>Array(11).fill(0)),c=code;
  const lluvia=[176,263,266,293,296,299,302,305,308,311,314,353,356,359].includes(c),
   nieve=[179,227,230,323,326,329,332,335,338,350,368,371,374,377,182,185,281,284,317,320,362,365].includes(c),
   tormenta=[200,386,389,392,395].includes(c),niebla=[143,248,260].includes(c);
  if(tormenta){sprite(g,NUBE,0,0);sprite(g,RAYO,0,6)}
  else if(lluvia){sprite(g,NUBE,0,0);sprite(g,GOTAS,0,7);sprite(g,GOTAS.slice().reverse(),0,9)}
  else if(nieve){sprite(g,NUBE,0,0);sprite(g,COPOS,0,7);sprite(g,COPOS.slice().reverse(),0,9)}
  else if(niebla){[2,4,6,8].forEach((y,i)=>sprite(g,[i%2?".#########.":"..#######.."],0,y))}
  else if(c==113)sprite(g,noche?LUNA:SOL,noche?0:2,noche?1:2);
  else if(c==116){sprite(g,noche?LUNA:SOL,0,0);sprite(g,NUBE,0,5,true)}
  else sprite(g,NUBE,0,2);
  return g}
function icono(cv,code,noche,d){const g=trama(code,noche),k=devicePixelRatio||1,u=d*2*k;cv.width=cv.height=11*u;cv.style.width=cv.style.height=11*d*2+'px';
  const x=cv.getContext('2d');g.forEach((r,j)=>r.forEach((v,i)=>{x.fillStyle=v?'#f2f2f2':'#1c1c1c';x.beginPath();x.arc(i*u+u/2,j*u+u/2,u*(v?.38:.13),0,7);x.fill()}))}

/* ---------- matriz de puntos ---------- */
const cv=$('cv'),cx=cv.getContext('2d');let W,H,cols,rows,G=16,NV=0;
function fit(){const r=cv.getBoundingClientRect(),k=devicePixelRatio||1;cv.width=r.width*k;cv.height=r.height*k;W=cv.width;H=cv.height;G=16*k;cols=Math.floor(W/G);rows=Math.floor(H/G)}
addEventListener('resize',fit);
function nivel(e,x,y,t){ // 0..1 por estado
  if(e==='cargando'){const v=((x+y*3)%24===Math.floor(t*10)%24)?1:0;return v*.5}
  const cxn=cols/2,cyn=rows/2,dx=x-cxn,dy=y-cyn,d=Math.hypot(dx,dy*1.4);
  if(e==='dormido')return Math.max(0,Math.sin(t*.8-d*.25))*.35*Math.exp(-d*.07)+((x*7+y*13)%29===0?.12:0);
  if(e==='escuchando')return Math.max(0,Math.sin(d*.55-t*3))*Math.exp(-d*.045)*.95;
  if(e==='hablando'){const a=(.08+.92*NV)*(.55+.45*Math.abs(Math.sin(x*.35+t*6)*Math.sin(x*.13-t*2.3))),h=a*rows/2*.95;return Math.abs(dy)<h?1:0}
  const ang=Math.atan2(dy,dx),f=((ang-t*3)%(2*Math.PI)+2*Math.PI)%(2*Math.PI); // trabajando: barrido radar
  return d<Math.min(cols,rows*1.4)*.46&&d>2?Math.pow(1-f/(2*Math.PI),3):0}
function dibuja(t){
  NV+=(S.nivel-NV)*.25;relojes();
  cx.clearRect(0,0,W,H);const e=S.estado,col=e==='dormido'?'255,255,255':e==='escuchando'||e==='trabajando'?'255,45,31':'255,255,255';
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const v=Math.min(1,nivel(e,x,y,t)),a=.09+.91*v;
    cx.fillStyle=`rgba(${v>.15?col:'255,255,255'},${a})`;cx.beginPath();cx.arc(x*G+G/2,y*G+G/2,G*(.12+.2*v),0,7);cx.fill()}
  requestAnimationFrame(t=>dibuja(t/1000))}

/* ---------- relojes vintage de puntos (aguja con muelle) ---------- */
const GA=[{id:'g0',rojo:.85,t:()=>S.mic?S.mic.nivel:0},{id:'g1',rojo:2,t:()=>NV},{id:'g2',rojo:.67,t:()=>S.lat==null?0:Math.min(1,S.lat/3000)}]
 .map(o=>({...o,cv:$(o.id),a:0,v:0}));
function relojes(){const k=devicePixelRatio||1;
  for(const o of GA){const c=o.cv,r=c.getBoundingClientRect();if(c.width!==Math.round(r.width*k)){c.width=Math.round(r.width*k);c.height=Math.round(r.height*k)}
    o.v=o.v*.78+(o.t()-o.a)*.14;o.a=Math.max(-.02,Math.min(1.03,o.a+o.v)); // muelle amortiguado: rebota como una aguja real
    const x=c.getContext('2d'),w=c.width,h=c.height,cx0=w/2,cy0=h*.8,R=Math.min(w*.46,h*.72),th=f=>Math.PI*(1.15-1.3*f);
    x.clearRect(0,0,w,h);
    for(let i=0;i<=40;i++){const f=i/40,m=i%5===0,p=[cx0+R*Math.cos(th(f)),cy0-R*Math.sin(th(f))];
      x.fillStyle=f>=o.rojo?(m?'#ff2d1f':'#a81d14'):(m?'#f2f2f2':'#5a5a5a');x.beginPath();x.arc(p[0],p[1],(m?2.6:1.5)*k,0,7);x.fill()}
    for(let i=0;i<=11;i++){const d=.14+.74*i/11,f=o.a,p=[cx0+R*d*Math.cos(th(f)),cy0-R*d*Math.sin(th(f))];
      x.fillStyle=i>8?'#ff2d1f':'#f2f2f2';x.beginPath();x.arc(p[0],p[1],(1.2+1.1*i/11)*k,0,7);x.fill()}
    x.fillStyle='#000';x.strokeStyle='#f2f2f2';x.lineWidth=1.5*k;x.beginPath();x.arc(cx0,cy0,5*k,0,7);x.fill();x.stroke()}}

/* ---------- celebración de impresión ---------- */
function celebrar(ev){
  $('celtxt').textContent=`${ev.archivo} · ${ev.total}`;$('cel').classList.add('on');
  const c=$('cv2'),k=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const g=22,t0=performance.now();
  (function f(){const t=(performance.now()-t0)/1000;if(t>25){$('cel').classList.remove('on');return}
    k.clearRect(0,0,c.width,c.height);
    for(let y=0;y<c.height/g;y++)for(let x=0;x<c.width/g;x++){const d=Math.hypot(x-c.width/g/2,y-c.height/g/2),v=Math.max(0,Math.sin(d*.5-t*5))*Math.exp(-d*.03)*Math.min(1,t);
      k.fillStyle=`rgba(255,45,31,${.08+.9*v})`;k.beginPath();k.arc(x*g+g/2,y*g+g/2,g*(.1+.3*v),0,7);k.fill()}
    requestAnimationFrame(f)})();
}
window.demo=(e='hablando')=>pintar({...S,estado:e}); // prueba en consola: demo('trabajando')
if(location.hash==='#celebra')setTimeout(()=>celebrar({archivo:'demo.gcode',total:'3 h 12 min'}),500);

/* ---------- conexión ---------- */
function geo(w){try{navigator.geolocation.getCurrentPosition(p=>w.readyState===1&&w.send(JSON.stringify({geo:[p.coords.latitude,p.coords.longitude]})),()=>{},{maximumAge:36e5,timeout:20000})}catch(e){}}
let WS=null;const cmd=c=>WS&&WS.readyState===1&&WS.send(JSON.stringify({cmd:c}));
[['b-priv','privacidad'],['b-modo','modo'],['b-dormir','dormir']].forEach(([i,c])=>$(i).addEventListener('click',()=>cmd(c)));
function ws(){const w=WS=new WebSocket(`ws://${location.host}/ws`);w.onopen=()=>geo(w);
  w.onmessage=m=>pintar(JSON.parse(m.data));
  w.onclose=()=>{$('conexion').textContent='PANEL SIN ENLACE';$('conexion').className='mal';setTimeout(ws,2000)}}
fit();ws();requestAnimationFrame(t=>dibuja(t/1000));
</script>
</body>
</html>
