<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icono.svg">
<title>Delta</title>
<style>
@font-face{font-family:Doto;font-weight:900;src:url(/fonts/doto-900.ttf)}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url(/fonts/plexmono-400.ttf)}
:root{--bg:#000;--fg:#f2f2f2;--dim:#5a5a5a;--line:#262626;--red:#ff2d1f}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:var(--bg);color:var(--fg);font-family:"IBM Plex Mono",monospace;
  display:grid;place-items:center;padding:16px}
form{width:min(100%,340px);display:flex;flex-direction:column;gap:14px}
h1{font-family:Doto;font-weight:900;font-size:64px;letter-spacing:.04em;line-height:1}
h1 i{color:var(--red);font-style:normal}
p{color:var(--dim);font-size:13px}
input{background:#0d0d0d;border:1px solid var(--line);color:var(--fg);font:inherit;font-size:16px;padding:14px;border-radius:12px}
input:focus{outline:none;border-color:var(--red)}
button{background:var(--fg);color:#000;border:0;font:inherit;font-weight:500;font-size:16px;padding:14px;border-radius:12px}
button:active{transform:scale(.98)}
.mal{color:var(--red)}
</style>
</head>
<body>
<form method="post" action="/entrar">
  <h1>DELTA<i>.</i></h1>
  <p>Introduzca la clave de acceso (está en <code>movil_clave.txt</code>, en el PC).</p>
  <p class="mal" id="mal" hidden>Clave incorrecta.</p>
  <input name="clave" type="password" autocomplete="current-password" placeholder="clave" required autofocus>
  <button>Entrar</button>
</form>
<script>if(location.search.includes("mal=1"))document.getElementById("mal").hidden=false</script>
</body>
</html>
