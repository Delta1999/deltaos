<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/iconos/icono-192.png">
<link rel="apple-touch-icon" href="/iconos/icono-192.png">
<title>Delta</title>
<style>
:root{--bg:#000;--text:#e8e8e8;--dim:#999;--accent:#d71921;--ok:#fff;--mono:"Space Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,sans-serif}
body{display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));text-align:center}
main{display:grid;gap:14px;justify-items:center;max-width:22rem}
.punto{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:late 1.6s ease-in-out infinite}
body.sube .punto{background:var(--ok)}
@keyframes late{50%{opacity:.25}}
h1{font-family:var(--mono);font-size:1.5rem;letter-spacing:.08em;color:#fff;text-transform:uppercase}
p{color:var(--dim);line-height:1.5}
.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
a{color:var(--text)}
@media (prefers-reduced-motion:reduce){.punto{animation:none}}
</style>
</head>
<body>
<main>
  <div class="punto"></div>
  <h1 id="titulo">Comprobando…</h1>
  <p id="texto"></p>
  <div class="lbl" id="hora"></div>
  <a id="abrir" href="https://fedora.tail630f35.ts.net/movil" hidden>Abrir Delta igualmente</a>
  <a href="/camara">Ver la cámara de la impresora</a>
</main>
<script>
const $ = id => document.getElementById(id);
const TEXTOS = {
  apagado: ["PC apagado", "El portátil está apagado o sin conexión. Delta vuelve en cuanto se encienda; esta página lo vigila sola."],
  delta_parado: ["Arrancando Delta", "El portátil ya está encendido, pero Delta aún no ha arrancado. Un momento."],
  encendido: ["Delta está aquí", "Abriendo…"],
};
async function mirar() {
  let e = "apagado", destino = "https://fedora.tail630f35.ts.net/movil";
  try {
    const r = await fetch("/estado", {cache: "no-store"});
    ({estado: e, destino} = await r.json());
  } catch (_) { e = "apagado"; }
  const [t, p] = TEXTOS[e];
  $("titulo").textContent = t;
  $("texto").textContent = p;
  $("hora").textContent = "Última comprobación " + new Date().toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit", second: "2-digit"});
  document.body.classList.toggle("sube", e !== "apagado");
  $("abrir").href = destino;
  $("abrir").hidden = e === "encendido";
  if (e === "encendido") location.replace(destino);
}
mirar();
setInterval(mirar, 4000);
</script>
</body>
</html>
