<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delta Apuntes</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-title dot">DELTA</span>
        <span class="brand-sub lbl">Apuntes</span>
      </div>
      <div class="doc-selector-wrap">
        <span class="lbl">Documento</span>
        <select id="doc-select">
          <option value="sample.pdf">sample.pdf</option>
        </select>
        <label id="btn-upload-doc" class="btn btn-icon" for="doc-upload-input" title="Abrir otro PDF" aria-label="Abrir otro PDF">+</label>
        <input type="file" id="doc-upload-input" accept="application/pdf" aria-label="Seleccionar PDF" style="display: none;">
      </div>
    </div>

    <div class="header-center">
      <div class="context-hud" id="context-hud">
        <span class="hud-item" id="hud-page">Pág <strong>1</strong></span>
        <span class="hud-sep"></span>
        <span class="hud-item" id="hud-cell">Celda <strong class="badge-cell">A1</strong></span>
        <span class="hud-sep"></span>
        <span class="hud-item hud-coords" id="hud-coords">(0, 0)</span>
        <span class="hud-sep"></span>
        <span class="hud-item hud-text" id="hud-text" title="Texto más cercano"><em>ninguno</em></span>
      </div>
    </div>

    <div class="header-right">
      <!-- Herramientas y Paleta de Subrayado -->
      <div class="hl-toolbar" id="hl-toolbar" title="Herramientas de subrayado">
        <button id="btn-tool-highlighter" class="btn btn-secondary active" title="Modo Subrayador (H)">🖍️ Subrayar</button>
        <div class="hl-palette" id="hl-palette">
          <button class="hl-swatch active" data-color="#fef08a" data-name="amarillo" style="background:#fef08a" title="Amarillo pastel"></button>
          <button class="hl-swatch" data-color="#bbf7d0" data-name="verde" style="background:#bbf7d0" title="Verde menta"></button>
          <button class="hl-swatch" data-color="#bae6fd" data-name="azul" style="background:#bae6fd" title="Azul cielo"></button>
          <button class="hl-swatch" data-color="#fbcfe8" data-name="rosa" style="background:#fbcfe8" title="Rosa pastel"></button>
          <button class="hl-swatch" data-color="#fed7aa" data-name="naranja" style="background:#fed7aa" title="Naranja melocotón"></button>
          <button class="hl-swatch" data-color="#e9d5ff" data-name="morado" style="background:#e9d5ff" title="Morado lila"></button>
          <button class="hl-swatch" data-color="#fecaca" data-name="rojo" style="background:#fecaca" title="Rojo coral"></button>
          <button class="hl-swatch" data-color="#a5f3fc" data-name="turquesa" style="background:#a5f3fc" title="Turquesa"></button>
        </div>
        <button id="btn-tool-eraser" class="btn btn-icon" title="Borrador de subrayado (clic en un resaltado para eliminarlo)">🧹</button>
      </div>

      <div class="control-group">
        <button id="btn-toggle-grid" class="btn btn-secondary active" title="Cuadrícula (G)">Cuadrícula</button>
        <button id="btn-toggle-recall" class="btn btn-secondary" title="Repaso activo (R)">Repaso</button>
      </div>

      <div class="zoom-controls">
        <button id="btn-zoom-out" class="btn btn-icon" title="Alejar (−)">−</button>
        <span id="zoom-label">120%</span>
        <button id="btn-zoom-in" class="btn btn-icon" title="Acercar (+)">+</button>
      </div>

      <div class="action-buttons">
        <button id="btn-undo" class="btn btn-icon" title="Deshacer (Ctrl+Z)">↩</button>
        <button id="btn-prev" class="btn btn-icon" title="Página anterior">←</button>
        <button id="btn-next" class="btn btn-icon" title="Página siguiente">→</button>
        <button id="btn-save" class="btn btn-secondary" title="Guardar notas">Guardar</button>
        <button id="btn-export" class="btn on" title="Compilar PDF vectorial">Exportar</button>
      </div>

      <div class="ws-status" id="ws-status" title="Enlace con Delta">
        <span class="status-dot"></span>
        <span class="status-text">Delta</span>
      </div>

      <div class="window-controls">
        <button id="btn-win-min" class="win-btn" title="Minimizar">–</button>
        <button id="btn-win-max" class="win-btn" title="Maximizar">□</button>
        <button id="btn-win-close" class="win-btn win-close" title="Cerrar">×</button>
      </div>
    </div>
  </header>

  <aside class="voice-simulator" id="voice-simulator">
    <div class="sim-header">
      <span class="sim-title lbl">Simulador de voz</span>
      <button id="btn-toggle-sim" class="btn-toggle-sim" title="Minimizar panel">▲</button>
    </div>
    <div class="sim-body" id="sim-body">
      <div class="quick-chips">
        <button class="chip" data-cmd="highlight_un_mes" title="Prueba exacta: Subrayar 'un mes si el acto fuera expreso' en línea 16">🖍️ «un mes si el acto fuera expreso»</button>
        <button class="chip" data-cmd="highlight_range_plazo" title="Rango: desde 'El plazo' hasta 'tres días'">🖍️ Rango «El plazo» → «tres meses»</button>
        <button class="chip" data-cmd="margin_note_double" title="Nota al margen con subrayado rojo y conector">📌 Nota + Subrayado rojo (1 mes natural)</button>
        <button class="chip" data-cmd="schema_jerarquia" title="Esquema jerárquico al margen desde ancla">🌳 Esquema «Jerarquía» (Órganos)</button>
        <button class="chip" data-cmd="bracket_text_anchor" title="Llave vertical de texto a texto">⎰ Llave «Iniciación» → «Finalización»</button>
        <button class="chip" data-cmd="box_fases" title="Recuadrar término">🔲 Recuadrar «FASES»</button>
        <button class="chip" data-cmd="strike_oficio" title="Tachar término">✂️ Tachar «de oficio»</button>
        <button class="chip" data-cmd="move_schema_left" title="Mover esquema a la izquierda">⬅️ Mover esquema a la izquierda</button>
        <button class="chip" data-cmd="schema_procedimiento">Esquema fases (E1)</button>
        <button class="chip" data-cmd="add_branch_recurso">Rama «Recursos»</button>
        <button class="chip" data-cmd="highlight_silencio">Subrayar «silencio»</button>
        <button class="chip" data-cmd="note_prescripcion">Nota «Plazo 4 años»</button>
        <button class="chip" data-cmd="stamp_examen">Sello examen</button>
        <button class="chip" data-cmd="toggle_grid">Cuadrícula adaptada</button>
        <button class="chip" data-cmd="toggle_recall">Repaso</button>
        <button class="chip" data-cmd="undo">↩ Deshacer</button>
        <button class="chip" data-cmd="clear_page">🗑️ Borrar página</button>
      </div>
      <div class="sim-custom">
        <input type="text" id="sim-input" placeholder='{"command": "highlight_passage", "args": {"target_text": "iniciarse de oficio", "color": "#fef08a"}}' />
        <button id="btn-send-sim" class="btn on">Enviar</button>
      </div>
    </div>
  </aside>

  <main class="main-viewport" id="main-viewport">
    <div class="pdf-container" id="pdf-container">
      <div class="loading-state lbl">Cargando documento…</div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
